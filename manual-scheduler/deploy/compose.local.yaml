services:
  student-api:
    networks: [private, public]
    ports:
      - "127.0.0.1:${STUDENT_API_PORT:-8001}:8000"
  staff-api:
    environment:
      COOKIE_SECURE: "false"
  gateway:
    ports:
      - "127.0.0.1:${STUDENT_PORT:-8080}:8080"
      - "127.0.0.1:${STAFF_PORT:-8081}:8081"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
